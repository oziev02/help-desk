services:
  postgres:
    image: postgres:16-alpine
    network_mode: host
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk
      PGPORT: "5433"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://helpdesk:helpdesk@127.0.0.1:5433/helpdesk?sslmode=disable
      APP_ENV: dev
      JWT_SECRET: dev-secret
      SEED_DEMO: "true"
    depends_on:
      postgres:
        condition: service_healthy
